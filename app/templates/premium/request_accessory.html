{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-md">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-headset fs-1 text-warning"></i>
                    <h2 class="card-title mt-2">Solicitud de Accesorios</h2>
                    <p class="card-text text-muted">Pide elementos como VideoBeams, mouses, etc.</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label for="catalog_id" class="form-label">Selecciona el Elemento</label>
                        <select name="catalog_id" id="catalog_id" class="form-select form-select-lg" required>
                            <option value="" selected disabled>-- Ver elementos disponibles --</option>
                            {% for item in items %}
                            <option value="{{ item.id }}" {% if item.available_count==0 %}disabled{% endif %}>
                                {{ item.title_or_name }} (Disponibles: {{ item.available_count }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="quantity" class="form-label">Cantidad</label>
                        <input type="number" name="quantity" id="quantity" class="form-control form-control-lg" min="1"
                            max="5" value="1" required>
                        {% if current_user.role == 'cliente' %}
                        <small class="form-text text-muted">Como cliente, tienes acceso a un número limitado de
                            elementos.</small>
                        {% endif %}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning btn-lg"><i
                                class="bi bi-send-fill me-2"></i>Confirmar Solicitud</button>
                        <a href="{{ url_for('main.premium_dashboard') }}" class="btn btn-outline-secondary">Volver al
                            Panel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
