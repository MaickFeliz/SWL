{% extends "base.html" %}

{% block content %}
<div class="col-md-8 mx-auto mt-4">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h3> Solicitud de Portátiles</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted">Solicitante</label>
                        <input type="text" class="form-control" value="{{ current_user.full_name }}" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted">Documento / Ficha</label>
                        <input type="text" class="form-control" 
                                value="{{ current_user.document_id }} {% if current_user.role == 'aprendiz' %}- Ficha: {{ current_user.ficha }}{% endif %}" 
                                disabled>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted">Fecha y Hora</label>
                        <input type="text" id="fechaHora" class="form-control" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted">Celular</label>
                        <input type="text" class="form-control" value="{{ current_user.phone }}" disabled>
                    </div>
                </div>

                <hr>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold"> Ambiente de Formación</label>
                        <input type="text" name="environment" class="form-control" placeholder="Ej: Ambiente 204 / Sistemas 1" required>
                    </div>

                    {% if current_user.role == 'instructor' %}
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold"> Ficha del Grupo</label>
                        <input type="text" name="associated_ficha" class="form-control" placeholder="Ficha a la que dicta clase" required>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold"> Cantidad de Equipos</label>
                        <input type="number" name="quantity" class="form-control" min="1" max="30" value="1" required>
                        <small class="text-muted">Indique cuántos portátiles necesita para la clase.</small>
                    </div>
                    {% else %}
                    <input type="hidden" name="quantity" value="1">
                    {% endif %}
                </div>

                <div class="d-grid gap-2 mt-3">
                    <button type="submit" class="btn btn-success btn-lg"> Enviar Solicitud</button>
                    <a href="{{ url_for('main.instructor_dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Poner fecha y hora actual automáticamente
    document.getElementById('fechaHora').value = new Date().toLocaleString();
</script>
{% endblock %}
