{% extends "base.html" %}
{% block content %}
<h2>👥 Gestión de Usuarios</h2>

<form method="GET" class="d-flex mb-4">
    <input type="text" name="search" class="form-control me-2" placeholder="Buscar por Nombre o Documento...">
    <button type="submit" class="btn btn-outline-primary">Buscar</button>
</form>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Documento</th>
            <th>Nombre</th>
            <th>Rol</th>
            <th>Ficha</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.document_id }}</td>
            <td>{{ user.full_name }}</td>
            <td>
                <span class="badge bg-{{ 'info' if user.role == 'aprendiz' else 'warning' if user.role == 'instructor' else 'dark' }}">
                    {{ user.role }}
                </span>
            </td>
            <td>{{ user.ficha or '-' }}</td>
            <td>
                <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#editUser{{ user.id }}">Editar</button>
            </td>
        </tr>

        <div class="modal fade" id="editUser{{ user.id }}" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Editar a {{ user.full_name }}</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form action="{{ url_for('admin.edit_user', id=user.id) }}" method="POST">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label>Nombre Completo</label>
                                <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                            </div>
                            <div class="mb-3">
                                <label>Celular</label>
                                <input type="text" name="phone" class="form-control" value="{{ user.phone }}">
                            </div>
                            <div class="mb-3">
                                <label>Rol</label>
                                <select name="role" class="form-select">
                                    <option value="aprendiz" {{ 'selected' if user.role == 'aprendiz' }}>Aprendiz</option>
                                    <option value="instructor" {{ 'selected' if user.role == 'instructor' }}>Instructor</option>
                                    <option value="bibliotecario" {{ 'selected' if user.role == 'bibliotecario' }}>Bibliotecario</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label>Ficha (Si aplica)</label>
                                <input type="text" name="ficha" class="form-control" value="{{ user.ficha or '' }}">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
