<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SWL{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="h-full flex flex-col text-slate-900">
    <nav class="sticky top-0 z-40 w-full glass">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-6 text-sm font-medium text-slate-600">
                <a href="{{ url_for('main.index') }}" class="hover:text-indigo-600 transition-colors">Inicio</a>

                {% if current_user.is_authenticated %}
                <a href="{{ url_for('main.profile') }}" class="hover:text-indigo-600 transition-colors">Perfil</a>

                <form action="{{ url_for('auth.logout') }}" method="post" class="m-0">
                    <button
                        class="bg-slate-900 text-white px-4 py-2 rounded-full hover:bg-slate-800 transition-all">Salir</button>
                </form>
                {% else %}
                <a href="{{ url_for('auth.login') }}" class="hover:text-indigo-600 transition-colors">Iniciar
                    Sesión</a>
                <a href="{{ url_for('auth.register') }}"
                    class="bg-indigo-600 text-white px-4 py-2 rounded-full hover:bg-indigo-700 transition-all shadow-sm">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-8 border-t border-slate-200 text-center text-slate-400 text-xs">
        © 2026 SWL — La Plata, Huila.
    </footer>
    <!-- HTMX — interactividad sin JavaScript complejo (local, CSP-safe) -->
    <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
